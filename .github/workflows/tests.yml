name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: craft_algolia_test
          POSTGRES_USER: craft_algolia_test
          POSTGRES_PASSWORD: craft_algolia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, intl, mbstring, bcmath, zip
          coverage: none

      - uses: ramsey/composer-install@v3

      # tests/.env is gitignored; the example values match the postgres service above
      - run: cp tests/.env.example tests/.env

      - run: vendor/bin/codecept run Unit
